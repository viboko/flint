name: Set up tools
description: >-
  Installs the given tools at the exact versions mise.toml pins (each
  download checked against mise.lock's checksum) and puts them on PATH
  for the steps after it. Every workflow installs its tools through this
  action, so a version only ever changes in mise.toml.

inputs:
  tools:
    description: >-
      Space-separated tools to install, named as mise.toml names them
      (e.g. `just cargo-deny github:bnjbvr/cargo-machete`).
    required: true
  cache:
    description: >-
      Whether to restore and save the installed tools from the Actions
      cache. Pass "false" in a job that publishes something or pushes
      with a write token: the cache is shared with PRs' runs.
    default: "true"

runs:
  using: composite
  steps:
    # mise itself is pinned here — bump it deliberately. Its version
    # doesn't change what any tool does, only how they're installed.
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: 2026.9.7
        install_args: ${{ inputs.tools }}
        cache: ${{ inputs.cache }}
