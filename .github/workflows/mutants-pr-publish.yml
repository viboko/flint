name: Mutation testing (PR, publish)

# The write-access half of the PR mutation-testing pipeline (see
# mutants-pr.yml for the read-only half, and docs/mutation-testing.md).
# The same split, for the same reasons, as coverage-publish.yml and
# bench-publish.yml — see docs/benchmarking.md ("CI").
#
# This trigger always runs this file as it is on `main` — never a PR's
# version of it — so a PR, including one from a fork, can't change what
# runs here with a write token. Nothing here checks out or executes PR
# code: it only reads the artifact mutants-pr.yml uploaded, and treats its
# contents as untrusted data. Keep it that way.
#
# zizmor flags the trigger as dangerous in general; the above is why
# it's safe here, so that finding is suppressed on the next line.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Mutation testing (PR)"]
    types: [completed]

permissions: {}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifact from mutants-pr.yml's run
      contents: read # check out the default branch's scripts (a private repo needs it)
      pull-requests: write # post/update the comment
    steps:
      # The default branch's scripts, not the PR's — see the top of this
      # file. First, so the failure step below can always use them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Download results
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name mutants-pr-result --dir mutants-pr-result

      # The artifact names its own PR, so check that claim: the PR must
      # exist and its head must be the commit mutants-pr.yml just ran on.
      # This stops a fork from pointing the comment at someone else's
      # PR, and also drops results that a newer push has already
      # superseded.
      - name: Validate
        id: pr
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(cat mutants-pr-result/pr-number)
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Artifact has an invalid PR number."
            exit 1
          fi
          if [ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$pr has moved on since this run — leaving it to the newer run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(cat mutants-pr-result/status)
          if [ "$status" != ran ] && [ "$status" != skipped ]; then
            echo "::error::Artifact has an invalid status."
            exit 1
          fi
          {
            echo "number=$pr"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update comment
        if: steps.pr.outputs.stale != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
          STATUS: ${{ steps.pr.outputs.status }}
        run: |
          # A "skipped" notice is only worth posting over an earlier
          # result; on its own it would just be noise.
          mode=""
          if [ "$STATUS" = skipped ]; then
            mode=update-only
          fi
          trusted/.github/scripts/pr-comment.sh "$PR" mutants-pr-result/comment.md $mode

      # workflow_run runs don't show up in a PR's checks, so without this
      # a failure anywhere above would be invisible from the PR. The PR
      # number comes from the validated artifact if we got that far, or
      # else from GitHub's own event data (which is empty for fork PRs —
      # then the failure is only visible in the Actions tab).
      - name: Report failure on the PR
        if: failure()
        env:
          PR: ${{ steps.pr.outputs.number || github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PR" ]; then
            echo "::warning::Couldn't tell which PR this run was for, so nothing was posted."
            exit 0
          fi
          python3 trusted/.github/scripts/mutants-report.py --publish-failed \
            --run-url "$RUN_URL" > failure.md
          trusted/.github/scripts/pr-comment.sh "$PR" failure.md
