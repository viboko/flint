name: Pages cleanup

# Removes a closed (or merged) PR's pr-<N>/ directory — its playground
# preview and coverage and benchmark reports — from the gh-pages branch.
# See docs/github-pages.md.
#
# This trigger always runs this file as it is on `main` — never a PR's
# version of it — and nothing here checks out or executes the PR's
# code, so it's safe to give it a write token. zizmor flags the trigger
# as dangerous in general, so that finding is suppressed on the next
# line.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove the PR's directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/gh-pages.sh "pr-$PR"
