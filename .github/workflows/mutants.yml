name: Mutation testing

# Weekly (or on demand), runs `just mutants` on `main`: every mutant
# cargo-mutants can make of the code under src/, each checked against
# both test suites. Reports the result in the run's step summary and in
# a tracking issue, opened while any mutant is missed and closed once
# none are. Informational: missed mutants never fail the run — only a
# broken one does. See docs/mutation-testing.md.
on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins; rustup directly, not an
      # action — see ci.yml.
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/setup-tools
        with:
          tools: just cargo:cargo-mutants
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Exit codes 2 (missed mutants) and 3 (timeouts) are results to
      # report, not a broken run; anything else (e.g. 4: the tests fail
      # even unmutated) is.
      - name: Mutation tests
        run: |
          status=0
          just mutants || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Build report
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir mutants-result
          jq .missed target/mutants.out/outcomes.json > mutants-result/missed
          python3 .github/scripts/mutants-report.py target/mutants.out \
            --blob-url "$BLOB_URL" --run-url "$RUN_URL" > mutants-result/report.md
          cat mutants-result/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-result
          path: mutants-result
          retention-days: 14

      # Each mutant's diff and test log, for working out why it was missed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: target/mutants.out
          retention-days: 14

  # A separate job, so the write token is never around while the tests
  # (and their mutants) run.
  issue:
    needs: mutants
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-result
          path: mutants-result
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/mutants-issue.sh mutants-result/report.md "$(cat mutants-result/missed)"
