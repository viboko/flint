name: Links

# Weekly (or on demand), checks every link in the repo's Markdown files,
# external ones included — what `just links-online` runs. PRs only check
# links within the repo (the `Link check` step in ci.yml), so that an
# external site being down never blocks one; this catches links that
# have rotted since. Config is in lychee.toml.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: just lychee

      # With the workflow's token, github.com links aren't rate-limited.
      - name: Link check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just links-online
