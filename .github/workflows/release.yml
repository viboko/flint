name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`) — see
# docs/agent/release.md for the version-bump-and-tag steps that precede
# this. Builds a release binary for each supported target (with
# release-build.yml, which every PR also runs as a dry run, see
# release-dry-run.yml), then publishes a GitHub Release with all of them
# attached, plus an SBOM for each and a signed build provenance
# attestation covering the lot.
on:
  push:
    tags:
      - "v*.*.*"

# Only the job that creates the GitHub Release gets write access; the
# builds don't need it.
permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # A signed SLSA build provenance attestation for each archive and
      # SBOM, tying it to this workflow run and commit. Check a download
      # with `gh attestation verify <file> --repo <owner>/flint`.
      # Attestations only work on public repos (or Enterprise Cloud).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.cdx.json \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md) for details."
