name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`) — see
# docs/agent/release.md for the version-bump-and-tag steps that precede
# this. Builds a release binary for each supported target, then publishes
# a GitHub Release with all of them attached, plus an SBOM for each and a
# signed build provenance attestation covering the lot.
#
# On a pull request it's a dry run: everything up to publishing, for
# every target, so the first real run on a tag isn't the first time any
# of it has run.
on:
  push:
    tags:
      - "v*.*.*"
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Only the job that creates the GitHub Release gets write access; the
# builds don't need it.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so every step below runs the same script
    # everywhere.
    defaults:
      run:
        shell: bash
    env:
      # `dry-run` stands in for the tag in file names on a PR.
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain rust-toolchain.toml pins; rustup directly, not an
      # action — see ci.yml.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"

      # No rust-cache here, deliberately: the cache is shared with other
      # workflows' runs (including PRs), so restoring it into a release
      # build would let anything that poisoned it end up inside the
      # published binaries. Releases are rare enough that a cold build
      # costs little. The tools skip the cache for the same reason.
      - uses: ./.github/actions/setup-tools
        with:
          tools: >-
            github:rust-secure-code/cargo-auditable
            github:CycloneDX/cyclonedx-rust-cargo
          cache: "false"

      # `cargo auditable` embeds the dependency list in the binary, so
      # `cargo audit bin` can check an installed flint for known
      # vulnerabilities later.
      - name: Build
        run: cargo auditable build --release --locked --target "$TARGET"

      # Catches the build silently falling back to a plain one.
      - name: Check the dependency list is embedded
        run: |
          case "$RUNNER_OS" in
            macOS) otool -l "target/${TARGET}/release/flint" | grep dep-v0 >/dev/null ;;
            Linux) readelf -S "target/${TARGET}/release/flint" | grep dep-v0 >/dev/null ;;
            # No readelf for PE files; the section's name is in its
            # header, and a plain build has nothing else by that name.
            Windows) LC_ALL=C grep -aq '\.dep-v0' "target/${TARGET}/release/flint.exe" ;;
          esac

      # Packaged as `flint-<tag>-<target>.tar.gz` (`.zip` on Windows)
      # holding the binary, README and licenses, plus a `.sha256`
      # checksum alongside it, which the Homebrew formula's checksums
      # come from too. The checksum names the archive without a
      # directory, so `shasum -c` (or `sha256sum -c`) works on it next to
      # the download.
      - name: Package
        run: |
          name="flint-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "../target/${TARGET}/release/flint.exe" "$name/"
            archive="$name.zip"
            7z a -tzip -bso0 "$archive" "$name"
          else
            cp "../target/${TARGET}/release/flint" "$name/"
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      # A CycloneDX SBOM of everything that goes into this target's
      # build (build dependencies included), as
      # `flint-<tag>-<target>.cdx.json`. Dated by the commit rather than
      # the build, so the same commit gives the same file.
      - name: SBOM
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --format json --spec-version 1.5 \
            --target "$TARGET" --override-filename "flint-${TAG}-${TARGET}.cdx"
          mv "flint-${TAG}-${TARGET}.cdx.json" dist/

      # Only needs to outlive this run: the release job picks it up
      # straight away.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-${{ matrix.target }}
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json

  # Builds the Linux release binary twice, from copies of the source in
  # two different directories, and fails unless the two are
  # byte-for-byte identical — so anyone can rebuild a release from its
  # tag and check they got what was published. No `--remap-path-prefix`
  # needed so far: Cargo passes a workspace crate's paths to rustc
  # relative to it, and the release profile embeds no debug info.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain rust-toolchain.toml pins; rustup directly, not an
      # action — see ci.yml.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # Uncached, like the build job, so this checks the same kind of
      # build that gets published.
      - uses: ./.github/actions/setup-tools
        with:
          tools: github:rust-secure-code/cargo-auditable
          cache: "false"

      - name: Build twice and compare
        run: |
          second="$RUNNER_TEMP/flint-second"
          cp -R . "$second"
          cargo auditable build --release --locked
          (cd "$second" && cargo auditable build --release --locked)
          sha256sum target/release/flint "$second/target/release/flint"
          cmp target/release/flint "$second/target/release/flint"

  release:
    needs: [build, reproducible]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # A signed SLSA build provenance attestation for each archive and
      # SBOM, tying it to this workflow run and commit. Check a download
      # with `gh attestation verify <file> --repo <owner>/flint`.
      # Attestations only work on public repos (or Enterprise Cloud).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/*.cdx.json \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$REPO/blob/main/CHANGELOG.md) for details."
